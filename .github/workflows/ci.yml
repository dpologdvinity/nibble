name: ci
on:
  push:
  pull_request:
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNIBBLE_NATIVE=OFF
      - run: cmake --build build -j
      - run: ctest --test-dir build -LE e2e --output-on-failure
  # Runner CPUs have AVX2/FMA/F16C, so the NATIVE=ON jobs (native, clang, sanitize) exercise the
  # SIMD kernels; release and fuzz stay NATIVE=OFF (portable, scalar). Runners usually lack
  # AVX-VNNI: the VNNI path is only tested locally.
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNIBBLE_NATIVE=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build -LE e2e --output-on-failure
  clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNIBBLE_NATIVE=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build -LE e2e --output-on-failure
  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNIBBLE_NATIVE=ON -DNIBBLE_SANITIZE=address,undefined
      - run: cmake --build build -j
      - run: ctest --test-dir build -LE e2e --output-on-failure
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: CXX=clang++ cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNIBBLE_FUZZ=ON -DNIBBLE_NATIVE=OFF
      - run: cmake --build build-fuzz -j --target fuzz_gguf fuzz_load make_seed
      - run: build-fuzz/make_seed build-fuzz/seed
      - run: build-fuzz/fuzz_gguf -max_total_time=60 build-fuzz/seed
      - run: build-fuzz/fuzz_load -max_total_time=60 build-fuzz/seed
