# Continuous integration for nibble. Runs on every push and pull request to the default branch.
#
#   environment      provisions the toolchain and the pinned Python tools (cached) and fetches Catch2 once
#   lint             clang-format, ruff, mypy, shellcheck           (fails fast: the build jobs wait for it)
#   static-analysis  clang-tidy over src/ and cli/
#   test             build + unit/integration tests in a matrix: portable (runtime-dispatched, as released; also run
#                    with NIBBLE_KERNELS=avx2), native gcc/clang, scalar kernels,
#                    AddressSanitizer + UBSan, ThreadSanitizer; JUnit results go to Codecov Test Analytics
#   coverage         gcc --coverage build, gcovr report (artifact + job summary + Codecov) with a minimum line coverage
#   fuzz             60 s each of the GGUF-parser and full-load libFuzzer targets on a seeded corpus
#   package          release tarballs and the container image (see package.yml)
#
# The end-to-end tests (tests labelled e2e) compare against llama.cpp on multi-gigabyte models and run locally only.
# Actions are pinned by commit SHA (kept current by Dependabot); the tag each SHA corresponds to is in the comment.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:  # release.yml runs the whole suite on the tagged commit before publishing anything
    inputs:
      skip-package:  # the release workflow builds its own, versioned packages
        type: boolean
        default: false

concurrency:
  # Pull requests share one group per ref, so a newer push cancels the older run. Every other run gets a group of
  # its own: with a shared group GitHub drops queued runs of rapid pushes (or of two tags on one commit), leaving
  # commits untested.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  DEPS_DIR: ${{ github.workspace }}/.deps-cache

jobs:
  environment:
    name: environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned Python tools
        run: python -m pip install -r requirements-ci.txt
      - name: Toolchain versions (fail early if something is missing or too old)
        run: |
          set -eux
          cmake --version
          g++ --version
          clang++ --version
          python --version
          clang-format --version
          clang-tidy --version
          ruff --version
          mypy --version
          shellcheck --version
          gcovr --version
          cmake --version | awk 'NR==1 { split($3, v, "."); exit !(v[1] > 3 || (v[1] == 3 && v[2] >= 25)) }'
      - name: Cache Catch2 (fetched at configure time)
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-${{ hashFiles('CMakeLists.txt') }}
      - name: Fetch dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: cmake -S . -B build-env -DFETCHCONTENT_BASE_DIR="$DEPS_DIR"

  lint:
    name: lint and format
    needs: environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the commit-subject check needs the PR's commits and the base branch
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: clang-format
        run: git ls-files '*.cpp' '*.h' | grep -v '^third_party/' | xargs clang-format --dry-run -Werror
      - name: ruff (lint and format) and mypy (strict types)
        run: |
          ruff check bench tools
          ruff format --check bench tools
          mypy
      - name: shellcheck
        run: shellcheck tools/*.sh
      - name: Conventional-commit subjects (pull requests)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --no-merges --format='%s' "$BASE_SHA..$HEAD_SHA" \
                | grep -Ev '^(feat|fix|perf|refactor|test|docs|build|ci|style|chore|revert)(\([a-z0-9_.,-]+\))?!?: .+' || true)
          if [ -n "$bad" ]; then echo "Not Conventional Commits:"; echo "$bad"; exit 1; fi

  static-analysis:
    name: clang-tidy
    needs: environment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Configure (compile database only; tests are not needed)
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNIBBLE_BUILD_TESTS=OFF
          cmake --build build --target nibble_git_header
      - name: clang-tidy
        run: |
          mapfile -t files < <(git ls-files 'src/*.cpp' 'cli/*.cpp' | sed "s|^|^$PWD/|; s|\$|\$|")
          run-clang-tidy.py -p build -j "$(nproc)" -quiet "${files[@]}"

  test:
    name: test (${{ matrix.name }})
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  # empty without secrets (forks, Dependabot, release.yml): upload skipped
    strategy:
      fail-fast: true
      matrix:
        include:
          # The release-shaped build: plain x86-64, kernels chosen at runtime (the runners have AVX2).
          - name: portable gcc
            flag: portable-gcc
            cmake: -DCMAKE_BUILD_TYPE=Release -DNIBBLE_NATIVE=OFF
            kernels: avx2
          - name: native gcc
            flag: native-gcc
            cmake: -DCMAKE_BUILD_TYPE=Release -DNIBBLE_NATIVE=ON
            kernels: avx2
          - name: native clang
            flag: native-clang
            cxx: clang++
            cmake: -DCMAKE_BUILD_TYPE=Release -DNIBBLE_NATIVE=ON
            kernels: avx2
          - name: scalar kernels on a native build
            flag: scalar-native
            cmake: -DCMAKE_BUILD_TYPE=Release -DNIBBLE_NATIVE=ON -DNIBBLE_SIMD=OFF
            kernels: scalar
          - name: asan+ubsan
            flag: asan-ubsan
            cmake: -DCMAKE_BUILD_TYPE=Debug -DNIBBLE_NATIVE=ON -DNIBBLE_SANITIZE=address,undefined
            kernels: avx2
            sanitizer: true
          - name: tsan
            flag: tsan
            cmake: -DCMAKE_BUILD_TYPE=Debug -DNIBBLE_NATIVE=ON -DNIBBLE_SANITIZE=thread
            kernels: avx2
            sanitizer: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Catch2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-${{ hashFiles('CMakeLists.txt') }}
      - name: Install ccache
        run: sudo apt-get install -y --no-install-recommends ccache
      # -march=native objects are only valid on the CPU that built them, but ccache hashes the literal flag, so the
      # cache key must carry the CPU's instruction set or a different runner CPU executes illegal instructions. The
      # model name alone is not enough: runners with the same model name expose different feature flags.
      - name: CPU model and feature flags (ccache key)
        id: cpu
        run: echo "id=$( (grep -m1 '^model name' /proc/cpuinfo; grep -m1 '^flags' /proc/cpuinfo) | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.name }}-${{ steps.cpu.outputs.id }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-${{ steps.cpu.outputs.id }}-
      - name: Let the sanitizers map memory (lower ASLR entropy)
        if: matrix.sanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        env:
          CXX: ${{ matrix.cxx || 'g++' }}
        run: |
          cmake -S . -B build ${{ matrix.cmake }} -DFETCHCONTENT_BASE_DIR="$DEPS_DIR" \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Check the expected kernel tier is selected
        run: |
          kernels=$(build/nibble info build/tests/data/small.gguf | sed -n 's/^kernels: //p')
          echo "kernels: $kernels"
          case "${{ matrix.kernels }}" in
            avx2) [[ "$kernels" == avx2* ]] ;;
            scalar) [[ "$kernels" == scalar ]] ;;
          esac
      - name: Test (everything except the end-to-end tests)
        # ctest writes the JUnit report relative to the test directory: build/junit.xml.
        run: ctest --test-dir build -LE e2e --output-on-failure --parallel "$(nproc)" --timeout 900 --output-junit junit.xml
      # The default run uses the strongest tier the runner has; force the others so each tier runs on every push
      # (NIBBLE_KERNELS=avx2+vnni errors on a runner without AVX-VNNI, so only the tiers every runner has).
      - name: Test with the AVX2 tier and the scalar kernels forced
        if: matrix.flag == 'portable-gcc'
        run: |
          NIBBLE_KERNELS=avx2 ctest --test-dir build -LE e2e --output-on-failure --parallel "$(nproc)" --timeout 900
          NIBBLE_KERNELS=scalar build/nibble info build/tests/data/small.gguf | grep -x 'kernels: scalar'
      # Codecov Test Analytics: per-test pass/fail history and flaky-test detection. Runs when tests fail too.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          report_type: test_results
          files: build/junit.xml
          flags: ${{ matrix.flag }}
          disable_search: true
          fail_ci_if_error: true

  coverage:
    name: coverage
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Empty for fork and Dependabot pull requests and for release.yml's call, which get no secrets; the upload
      # step is skipped then, and the gcovr threshold above still gates the job.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Restore Catch2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-${{ hashFiles('CMakeLists.txt') }}
      - name: Build with coverage instrumentation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage -O0" -DNIBBLE_NATIVE=ON \
                -DFETCHCONTENT_BASE_DIR="$DEPS_DIR"
          cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build -LE e2e --output-on-failure --parallel "$(nproc)" --timeout 1800
      # Again with the scalar kernels forced, so the backend's scalar branches (taken on CPUs without AVX2) are
      # exercised and counted too; gcov accumulates both runs.
      - name: Test with the scalar kernels forced
        run: NIBBLE_KERNELS=scalar ctest --test-dir build -LE e2e --output-on-failure --parallel "$(nproc)" --timeout 1800
      - name: Coverage report
        run: |
          # --merge-lines: the SIMD kernels are compiled once per tier, so each source line has one copy per tier; a
          # line counts as covered when any copy ran (the runners have no AVX-VNNI, so the vnni copy never runs).
          # no_working_dir_found/source_not_found only come from CMake's compiler-id probes and Catch2, which the
          # --filter flags exclude from the report anyway.
          set -o pipefail  # a gcovr failure (or the threshold) must fail the step, not be masked by tee
          mkdir -p coverage
          gcovr --root . --object-directory build --filter 'src/' --filter 'cli/' --exclude-throw-branches \
                --exclude-directories '.*\.deps-cache' \
                --gcov-ignore-parse-errors=negative_hits.warn \
                --gcov-ignore-errors=no_working_dir_found --gcov-ignore-errors=source_not_found \
                --merge-lines \
                --print-summary --xml-pretty --xml coverage/coverage.xml --html-details coverage/index.html \
                --fail-under-line "${MIN_LINE_COVERAGE}" | tee coverage/summary.txt
          { echo '### Coverage (src/ and cli/)'; echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          MIN_LINE_COVERAGE: "80"
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  fuzz:
    name: fuzz (60 s each)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build fuzz targets
        env:
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNIBBLE_FUZZ=ON -DNIBBLE_NATIVE=OFF \
                -DNIBBLE_BUILD_TESTS=OFF
          cmake --build build-fuzz -j "$(nproc)" --target fuzz_gguf fuzz_load make_seed
      - run: build-fuzz/make_seed build-fuzz/seed
      - run: build-fuzz/fuzz_gguf -max_total_time=60 build-fuzz/seed
      - run: build-fuzz/fuzz_load -max_total_time=60 build-fuzz/seed

  package:
    name: package
    needs: [test, static-analysis, coverage, fuzz]
    if: ${{ !inputs.skip-package }}
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read
