# Reason: answer `@claude <request>` on an issue, a pull request or a review (and in a new issue) so the owner can
# hand Claude Code a task from the GitHub UI. It answers or pushes an `agent/<topic>` branch and opens a pull
# request labelled `agent`; agent pull requests are never auto-merged. Runs on the owner's Claude subscription
# through the CLAUDE_CODE_OAUTH_TOKEN repository secret, not an API key. Modelled on the owner's daydaze claude.yml.
# The repository is public, so the first gate is the commenter's author_association (OWNER, MEMBER or COLLABORATOR)
# plus the text `@claude`. The action also refuses anyone without write access and skips pull requests from forks
# (allow_fork_prs). A missing secret (forks, Dependabot, owner step not done) skips with a notice, never red.
# Claude's pushes use the Claude GitHub App's token (the action trades the run's OIDC token for it), so CI runs on its
# branches, unlike pushes made with GITHUB_TOKEN. Claude gets the toolchain and the pinned lint tools so a branch can
# land green.
# By hand: not runnable with workflow_dispatch; comment `@claude <request>` on an issue or pull request.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Least privilege: read-only except what Claude needs to push a branch and comment. id-token is how the action
# trades the run's OIDC token for the Claude GitHub App's short-lived token. actions: read lets it read CI results.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

env:
  PYTHON_VERSION: "3.12"
  DEPS_DIR: ${{ github.workspace }}/.deps-cache
  # Claude's own `cmake -S . -B build` picks ccache up from the environment.
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  claude:
    # The author_association of the comment, review or issue that carries the trigger phrase.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One run per issue or pull request; a second comment waits instead of cancelling work in progress.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check for the CLAUDE_CODE_OAUTH_TOKEN secret
        id: secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=claude skipped::the CLAUDE_CODE_OAUTH_TOKEN secret is not available to this run"
            echo "claude skipped: the CLAUDE_CODE_OAUTH_TOKEN secret is not available to this run (forks and Dependabot get no secrets; otherwise set it with \`gh secret set CLAUDE_CODE_OAUTH_TOKEN\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secret.outputs.present == 'true'
        with:
          fetch-depth: 1
      # Without the pinned tools Claude could not run the lint block, and its branches would land red.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.secret.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install the build and lint tools
        if: steps.secret.outputs.present == 'true'
        run: |
          python -m pip install -r requirements-ci.txt
          sudo apt-get install -y --no-install-recommends ccache
          cmake --version
          g++ --version
          clang++ --version
      - name: Restore Catch2
        if: steps.secret.outputs.present == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-${{ hashFiles('CMakeLists.txt') }}
      # Configure once so Claude's later `cmake --build build` finds Catch2 (and remembers where it lives).
      - name: Configure (Release)
        if: steps.secret.outputs.present == 'true'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_BASE_DIR="$DEPS_DIR"
      # The action reads CLAUDE.md (which imports AGENTS.md) from the checkout.
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        if: steps.secret.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: "false"
          branch_prefix: agent/
          claude_args: |
            --allowedTools "Bash(cmake:*),Bash(ctest:*),Bash(clang-format:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(python -m unittest:*),Bash(ruff:*),Bash(mypy:*),Bash(shellcheck:*),Bash(build/nibble:*),Bash(grep:*),Bash(xargs clang-format:*)"
            --append-system-prompt "Follow AGENTS.md. Work on a branch named agent/<topic>, never push to master, Conventional Commits, label your PRs agent. Before pushing run the lint block from AGENTS.md and ctest --test-dir build -LE e2e. The build directory build/ is already configured (Release); build with cmake --build build -j 4. The pinned lint tools from requirements-ci.txt are installed. Fix every failure and push only when all of them pass. The e2e tests need models that are not available here, so do not run them."
