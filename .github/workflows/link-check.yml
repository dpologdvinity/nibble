# Reason: the README, ARCHITECTURE, CONTRIBUTING, SECURITY and docs/ link to papers, upstream projects, workflow files
# and anchors, and links rot without any commit touching them. This checks every link weekly with lychee (settings in
# .lychee.toml) and keeps ONE open issue, "docs: broken links found by the link check" (label `documentation`), whose
# body is the latest list of broken links; a later green run comments and closes it.
#   links   runs lychee with a read-only token and uploads its Markdown report. lychee's exit code 2 means broken
#           links; any other non-zero code (a bad config, a crash) fails this job instead of filing an issue.
#   report  the only job with `issues: write`; it runs no checked-out code and only on master (a hand run from another
#           branch, `--ref`, opens no issue). The issue is found by exact title, never by gh's fuzzy search, among the
#           open issues github-actions[bot] opened with the `documentation` label, so a same-titled issue someone else
#           opened never gets the report nor is closed by a green run.
# By hand: `gh workflow run link-check.yml`, or locally
#   lychee --config .lychee.toml README.md ARCHITECTURE.md CONTRIBUTING.md SECURITY.md docs
# Actions are pinned by commit SHA (kept current by Dependabot); the tag each SHA corresponds to is in the comment.
name: link-check

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

concurrency:
  group: link-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  links:
    name: check links
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      broken: ${{ steps.verdict.outputs.broken }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml README.md ARCHITECTURE.md CONTRIBUTING.md SECURITY.md docs
          format: markdown
          output: lychee-report.md
          jobSummary: true
          fail: false  # the verdict step below tells broken links (exit 2) from a lychee error
      - name: Verdict
        id: verdict
        env:
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          case "$EXIT_CODE" in
            0) echo "broken=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "broken=true" >> "$GITHUB_OUTPUT"
               echo "::warning::broken links found; see the report in the job summary" ;;
            *) echo "::error::lychee exited with $EXIT_CODE (an error in lychee or its config, not a broken link)"
               exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.verdict.outputs.broken == 'true'
        with:
          name: lychee-report
          path: lychee-report.md
          retention-days: 7

  report:
    name: keep one issue
    needs: links
    if: github.ref == 'refs/heads/master' && needs.links.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "docs: broken links found by the link check"
      BROKEN: ${{ needs.links.outputs.broken }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.BROKEN == 'true'
        with:
          name: lychee-report
      - name: Open, update or close the issue
        run: |
          set -euo pipefail
          # Exact title match (gh's --search is fuzzy) on the bot's own open issues with the documentation label; the
          # creator and the label are checked again on each item. The oldest open match if there were ever two.
          issue=$(gh api --paginate \
            "repos/$GH_REPO/issues?state=open&creator=github-actions%5Bbot%5D&labels=documentation&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.TITLE and .user.login == "github-actions[bot]"
                    and any(.labels[]; .name == "documentation")) | .number' | sort -n | sed -n 1p)
          if [ "$BROKEN" = "true" ]; then
            {
              echo "The weekly link check found broken links ([run]($RUN_URL)). This body is replaced by each run that"
              echo "still finds some, and the issue is closed when a run finds none."
              echo
              head -c 60000 lychee-report.md  # an issue body holds at most 65536 characters
            } > body.md
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file body.md
              gh issue comment "$issue" --body "Still broken in [this run]($RUN_URL); the body lists the current links."
            else
              gh issue create --title "$TITLE" --label documentation --body-file body.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "No broken links in [this run]($RUN_URL)."
          fi
