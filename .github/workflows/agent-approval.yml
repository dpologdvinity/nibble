# Reason: branch protection on master asks for no approving review, so nothing stops an agent pull request (opened by
# the Claude GitHub App, claude[bot], or labelled `agent`) from being merged without the owner. This check
# (`agent-approval`) fails for such a pull request until an owner, member or collaborator has APPROVED its current head
# commit, and passes at once for every other pull request. Making it a required check is what enforces the wait; that
# is the owner's decision (Settings > Branches, or `gh api` on the branch protection), not something this file does.
# Limit: a pull request can edit this workflow file, so it guards against the agent merging or the owner merging by
# mistake, not against an agent that rewrites its own gate; the script is always read from the base branch.
# Triggers: pull_request_target (so the workflow and script come from the base branch and fork pull requests are
# covered) when a pull request is opened, pushed to, reopened, (un)labelled or made ready, and pull_request_review when
# a review is submitted or dismissed. It checks out only the base commit and runs no pull request code.
# By hand: not runnable (it needs a pull request event); re-run the check from the pull request's Checks tab.
# Logic: tools/ci/agent_gate.py (tests: tools/ci/test_agent_gate.py).
name: agent-approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

concurrency:
  group: agent-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit: the script that judges a pull request must not come from the pull request.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check for an approval of the current head
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          # Only the pull request that adds the script runs without it (its base does not have it yet).
          if [ ! -f tools/ci/agent_gate.py ]; then
            echo "::notice title=agent-approval::tools/ci/agent_gate.py is not on the base branch yet; nothing to check"
            exit 0
          fi
          python3 tools/ci/agent_gate.py --pr "$PR_NUMBER" | tee -a "$GITHUB_STEP_SUMMARY"
