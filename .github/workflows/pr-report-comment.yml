# Reason: pr-report.yml measures a pull request with the pull request's own code, so it has a read-only token and no
# secrets and cannot comment. This workflow is the other half of that trust split: it starts from `workflow_run` when
# `pr-report` completes, holds the only write token (pull-requests: write, actions: read), and never checks out or runs
# pull request code. It checks out the default branch for tools/ci, downloads the `pr-report` artifact of the
# triggering run, and `tools/ci/pr_report.py post` validates that untrusted JSON strictly, finds the pull request
# through the API from the run's head SHA (never from the artifact) and renders Markdown from validated fields only.
# The run's head SHA reaches the script through `env:` (HEAD_SHA), never inside the script text.
# A run that produced no artifact (the triggering run was cancelled, or a job failed before `assemble`) ends with a
# notice, not a red job: the red job is the one in pr-report.
# By hand: not possible, the run, its artifact and the pull request come from the `workflow_run` event; push to the
# pull request to run pr-report.yml again. Like every `workflow_run` workflow, this file is read from the default
# branch, so a change to it only takes effect after it is merged.
# Actions are pinned by commit SHA (kept current by Dependabot); the tag each SHA corresponds to is in the comment.
name: pr-report-comment

on:
  workflow_run:
    workflows: [pr-report]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

# Two runs for the same commit would race to create the comment; the second waits and then edits it.
concurrency:
  group: pr-report-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    name: comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No `ref:`: a workflow_run checks out the default branch, which is what must supply tools/ci here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Is there a report to post?
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr-report" and (.expired | not))] | length')
          if [ "$count" -ge 1 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=pr-report-comment::the triggering run left no pr-report artifact (cancelled, or a job failed before assemble); nothing to post"
            echo "No pr-report artifact on run $RUN_ID: nothing posted." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Into its own empty directory; the artifact is untrusted data and is only ever read as JSON by pr_report.py.
      - name: Download the report
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post the comment
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python tools/ci/pr_report.py post report/pr-report.json --head-sha "$HEAD_SHA"
