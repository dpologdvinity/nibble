# Reason: pr-report.yml measures a pull request with the pull request's own code, so it has a read-only token and no
# secrets and cannot comment. This workflow is the other half of that trust split: it starts from `workflow_run` when
# `pr-report` completes, holds the only write token (the job has pull-requests: write and actions: read, plus contents: read), and never checks out or runs
# pull request code. It checks out the default branch for tools/ci, downloads the `pr-report` artifact of the
# triggering run, and `tools/ci/pr_report.py post` validates that untrusted JSON strictly, finds the pull request
# through the API from the run's head SHA (never from the artifact) and renders Markdown from validated fields only.
# The run's head SHA reaches the script through `env:` (HEAD_SHA), never inside the script text.
# The comment's heading names the head commit it describes. A run that produced no artifact (the triggering run was
# cancelled, or a job failed before `assemble`) posts no report: the red job is the one in pr-report. But the comment
# from an earlier head would still read as current, so `pr_report.py outdated` puts a visible "Outdated" banner on it
# naming the new head and linking the run (only when the pull request's head is still that commit; the next report
# replaces the comment, banner included).
# By hand: not possible, the run, its artifact and the pull request come from the `workflow_run` event; push to the
# pull request to run pr-report.yml again. Like every `workflow_run` workflow, this file is read from the default
# branch, so a change to it only takes effect after it is merged.
# Actions are pinned by commit SHA (kept current by Dependabot); the tag each SHA corresponds to is in the comment.
name: pr-report-comment

on:
  workflow_run:
    workflows: [pr-report]
    types: [completed]

permissions: {}

# One comment job at a time per pull request branch (the repository and branch the run came from), so a post for one
# head and an `outdated` mark for another can never interleave their read and write of the same comment; `outdated`
# also checks the head again just before it writes. Never cancelled; GitHub keeps one pending run per group, and a
# replaced pending run is always older than the one that replaces it.
concurrency:
  group: pr-report-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read  # checkout of the default branch
      pull-requests: write  # the one comment
      actions: read  # list and download the triggering run's artifact
    steps:
      # No `ref:`: a workflow_run checks out the default branch, which is what must supply tools/ci here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Is there a report to post?
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr-report" and (.expired | not))] | length')
          if [ "$count" -ge 1 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=pr-report-comment::the triggering run left no pr-report artifact (cancelled, or a job failed before assemble); no report, an earlier one is marked outdated"
            echo "No pr-report artifact on run $RUN_ID: no report posted; an earlier report on the pull request is marked outdated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mark an earlier report outdated
        if: steps.artifact.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python tools/ci/pr_report.py outdated --head-sha "$HEAD_SHA" --run-url "$RUN_URL"
      # Into its own empty directory outside the checkout; the artifact is untrusted data and is only ever read as JSON by pr_report.py.
      - name: Download the report
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-report
          path: ${{ runner.temp }}/pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post the comment
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPORT_DIR: ${{ runner.temp }}/pr-report
        run: python tools/ci/pr_report.py post "$REPORT_DIR/pr-report.json" --head-sha "$HEAD_SHA" --run-url "$RUN_URL"
