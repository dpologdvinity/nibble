# Reason: an automatic first-pass review of pull requests by the owner, by Dependabot and by Claude itself (label
# `agent`), so a change gets a second reader against nibble's rules (numerics, decode-path allocation, error
# handling, tests, least-privilege workflows) before the owner reads it. It posts inline comments only; it never
# approves or requests changes, so it can never satisfy or block branch protection. Runs on the owner's Claude
# subscription through the CLAUDE_CODE_OAUTH_TOKEN repository secret.
# Also starts when the `agent` label is added to a pull request.
# Skips with a notice, never red, when the secret is not available: forks always, Dependabot unless the same token is
# also stored as a Dependabot secret (and GitHub gives Dependabot runs a read-only token, so its inline comments may
# not post). Drafts are skipped; marking a draft ready for review starts the review.
# Agent mode, read-only: with a `prompt` and no `track_progress`, the action runs agent mode for pull_request events,
# which has no tracking comment, no commit or push wrappers and no auto permission mode (allowed_bots is set). Edit
# and Write are denied on top of that, because `permissions: contents: read` only limits GITHUB_TOKEN, not the Claude
# GitHub App token the action obtains.
# How it is triggered: by a pull_request event, never by hand and there is no workflow_dispatch; push to the pull
# request, mark it ready for review or add the `agent` label.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

# The review reads the pull request and writes comments; id-token is how the action gets the Claude GitHub App's token.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Not a draft, and one of: a pull request by an OWNER/MEMBER/COLLABORATOR, by Dependabot, or an `agent` pull
    # request from a branch of this repository (a fork cannot use the label to get a review).
    # A `labeled` event only counts when the label is `agent` (any other label would start a review per label).
    if: |
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent') && (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        (contains(github.event.pull_request.labels.*.name, 'agent') &&
          github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A newer push makes the running review stale. A label event for any label but `agent` is skipped by the `if:`
    # above, but gets a group of its own anyway so that it can never cancel a running review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'agent' && format('-label-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    steps:
      - name: Check for the CLAUDE_CODE_OAUTH_TOKEN secret
        id: secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=claude-review skipped::the CLAUDE_CODE_OAUTH_TOKEN secret is not available to this run"
            echo "claude-review skipped: the CLAUDE_CODE_OAUTH_TOKEN secret is not available to this run (forks get no secrets; Dependabot needs the token as a Dependabot secret; otherwise set it with \`gh secret set CLAUDE_CODE_OAUTH_TOKEN\`)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secret.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      # The action reads CLAUDE.md (which imports AGENTS.md) from the checkout.
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        if: steps.secret.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: "false"
          # claude[bot] is the actor of a push or pull request made through the Claude GitHub App; without it those
          # runs fail with "non-human actor" instead of reviewing (the action also strips the [bot] suffix).
          allowed_bots: dependabot[bot],claude[bot]
          # The comment classifier needs an API key and is skipped with an OAuth token (it then posts everything);
          # say so, so inline comments are posted at once.
          classify_inline_comments: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for nibble, a from-scratch C++20 LLM inference engine checked against
            llama.cpp. AGENTS.md and ARCHITECTURE.md describe the conventions. Read the diff with gh pr diff and
            the surrounding code when a change needs it. Look for real defects and rule violations, in this order:

            1. Numerics and bit-identity: kernel translation units that must match the scalar code bit for bit stay
               in the -ffp-contract=off list in CMakeLists.txt; a SIMD tier must reproduce the scalar result; no
               symbol outside a tier's namespace.
            2. No allocation on the decode path (alloc_tests enforces it).
            3. Error handling: input-caused errors throw nibble::Error (file-derived text through escape_control);
               internal invariants use NIBBLE_DCHECK. Not the other way round.
            4. Tests come with the change, and a bug fix has a test that fails without the fix. No skipped tests, no
               suppressions without a stated reason.
            5. Other AGENTS.md conventions: a file-header comment, documented contracts, README.md and
               ARCHITECTURE.md kept true, Conventional Commits.
            6. Workflow changes: least-privilege permissions, actions pinned to a full SHA, no GitHub expression expansion of
               untrusted text inside run: scripts, no secret reachable from pull request code.

            Rules for the output:
            - Inline comments only, through mcp__github_inline_comment__create_inline_comment, one per finding, on
              the line it concerns. Say what is wrong and what to change.
            - Never approve and never request changes. Do not post a top-level review or a summary comment.
            - Be concise. No praise, no restating the diff, no style nits that clang-format or ruff already enforce.
            - If there is nothing worth a comment, post nothing.
          # No gh pr view: its --jq filter can print the process environment, which holds the OAuth token, and a
          # prefix rule cannot forbid a flag (gh pr diff has no --jq).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Read,Grep,Glob"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit"
