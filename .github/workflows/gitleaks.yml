# Secret scanning with gitleaks. The lefthook pre-commit hook is optional and GitHub push protection only knows
# provider token patterns, so this scans every commit for generic secrets too (keys, passwords, high-entropy values).
#
#   push / pull_request   scan only the commits being added: PR base..head, or before..sha on a push. A push that
#                         creates a branch (`before` is all zeros) or force-pushes past a commit the checkout does not
#                         contain has no usable range, so it scans the full history instead (a second or so here).
#   schedule / dispatch   scan the full history (Wednesday 02:29 UTC, so a rule update reaches old commits too)
#
# Findings are redacted in the log. Known false positives live in .gitleaksignore (read from the repo root).
# gitleaks/gitleaks-action is not used: it needs a licence key for organizations. The binary comes from the release
# page at a pinned version, checked against the SHA-256 that the release's checksums file lists for it.
# To bump: set GITLEAKS_VERSION and take the new checksum from gitleaks_<version>_checksums.txt on the release.
# Run by hand:  gh workflow run gitleaks.yml   (or locally:  gitleaks git --redact --no-banner)
name: gitleaks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "29 2 * * 3"
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's gitleaks_8.30.1_checksums.txt
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the whole history: the range below, and the full scans, need every commit
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=""
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              # All zeros: a new branch. A before commit missing from the clone: a force push that dropped it.
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                echo "No usable previous commit (new branch or force push): scanning the full history."
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
          esac
          gitleaks version
          if [[ -n "$range" ]]; then
            echo "Scanning commits $range"
            gitleaks git --log-opts="$range" --redact --no-banner
          else
            gitleaks git --redact --no-banner
          fi
