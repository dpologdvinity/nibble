# Reason: the changelog, the triage issues and the dashboard group work by area, so every pull request gets area
# labels (kernels, gguf, tokenizer, ...) from the paths it changes. The path -> label table is .github/labeler.yml,
# generated from tools/ci/labels.py (which also defines the labels: `python tools/ci/labels.py sync`).
# Runs on pull_request_target so fork PRs can be labeled; it never checks out PR code, and actions/labeler reads the
# changed-file list and labeler.yml from the base branch through the API.
# By hand: not runnable (it needs a pull request event); to re-label, push to the PR or close and reopen it.
name: labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
