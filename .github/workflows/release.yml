# Release workflow: pushing a tag like v0.7.0 builds the artifacts, pushes the container image to ghcr.io and
# creates a DRAFT GitHub release with the tarballs attached. The draft is published by hand after a final check.
#
# The workflow only needs the built-in GITHUB_TOKEN; the one-time repository settings (workflow permissions,
# package visibility) are listed in the owner checklist kept outside the repository history.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    needs: verify
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read
      packages: write
    with:
      push-image: true
      version: ${{ github.ref_name }}

  release:
    name: draft release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # Only this tag's tarballs: the verify job's CI run also uploads coverage reports and commit-named
          # tarballs, and the image build uploads build records; none of those belong in a release.
          pattern: nibble-${{ github.ref_name }}-*
          merge-multiple: true
      - name: Create the draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
