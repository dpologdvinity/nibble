# Release workflow: pushing a tag like v0.7.0 builds the artifacts, pushes the container image to ghcr.io, signs
# them (build provenance and an SPDX SBOM for each tarball and for the image, as GitHub attestations) and creates a
# DRAFT GitHub release with the tarballs and SBOMs attached. The draft is published by hand after a final check.
#
# The release notes are the tag's section of CHANGELOG.md, which the release-prep pull request generates
# (`git cliff --tag vX.Y.Z -o CHANGELOG.md`, see cliff.toml). The workflow fails when that section is missing.
# Verify a download with: gh attestation verify nibble-<tag>-linux-x86_64.tar.gz -R dpologdvinity/nibble
#
# The workflow only needs the built-in GITHUB_TOKEN; the one-time repository settings (workflow permissions,
# package visibility) are listed in the owner checklist kept outside the repository history.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  changelog:
    # Fails fast, before anything is built or pushed, when the release-prep pull request was skipped.
    name: changelog section
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract this tag's section of CHANGELOG.md
        run: |
          # The body of the "## [<tag>]" section: the lines after its heading (the release title already says the
          # tag) up to the next "## [" heading or the generated-by footer comment. index() compares plain text, so
          # the dots in the tag are not regex wildcards and "v0.8.0" never matches "v0.8.0-rc1".
          awk -v tag="$GITHUB_REF_NAME" '
            index($0, "## [" tag "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^<!-- generated by git-cliff/) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! awk -v tag="$GITHUB_REF_NAME" 'index($0, "## [" tag "]") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME: run git cliff --tag $GITHUB_REF_NAME -o CHANGELOG.md in the release-prep PR"
            exit 1
          fi
          cat notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: changelog
    uses: ./.github/workflows/ci.yml
    with:
      skip-package: true
    permissions:
      contents: read

  package:
    needs: verify
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read
      packages: write
    with:
      push-image: true
      version: ${{ github.ref_name }}

  attest:
    # Signs the tarballs and the pushed image. It lives here, not in package.yml, because ci.yml also calls
    # package.yml with read-only permissions and a called workflow cannot ask for more than its caller grants.
    name: attest artifacts
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the signing certificate is issued to this workflow's OIDC identity
      attestations: write
      packages: write # push-to-registry stores the image's attestations next to it in ghcr.io
    env:
      IMAGE_DIGEST: ${{ needs.package.outputs.image-digest }}
      TARBALL: nibble-${{ github.ref_name }}-linux-x86_64
    steps:
      - name: The package job must have pushed an image
        run: test -n "$IMAGE_DIGEST"
      - name: Image name as metadata-action pushed it
        env:
          REPOSITORY: ${{ github.repository }}
        # docker/metadata-action lowercases the repository; ghcr.io rejects uppercase, so match it exactly.
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: nibble-${{ github.ref_name }}-*
          merge-multiple: true
      - name: Directory for the SBOMs
        # sbom-action writes output-file as given and does not create its parent directory.
        run: mkdir -p sbom
      - name: Log in to ghcr.io
        # push-to-registry below reads the runner's Docker credentials; the package job logged in on another runner.
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM of the tarball
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/${{ env.TARBALL }}.tar.gz
          format: spdx-json
          output-file: sbom/${{ env.TARBALL }}.spdx.json
          upload-artifact: false # uploaded below with the image SBOM
          upload-release-assets: false # the release job attaches everything
      - name: SBOM of the container image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ env.IMAGE_DIGEST }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom/nibble-${{ github.ref_name }}-container-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Provenance of the tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Provenance of the container image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - name: Attach the tarball SBOM to the tarball
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/${{ env.TARBALL }}.tar.gz
          sbom-path: sbom/${{ env.TARBALL }}.spdx.json
      - name: Attach the image SBOM to the image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: sbom/nibble-${{ github.ref_name }}-container-image.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Named like the tarball artifacts so the release job's "nibble-<tag>-*" download picks it up.
          name: nibble-${{ github.ref_name }}-sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft release
    needs: [attest, changelog]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # This tag's tarballs and SBOMs: the verify job's CI run also uploads coverage reports and commit-named
          # tarballs, and the image build uploads build records; none of those belong in a release.
          pattern: nibble-${{ github.ref_name }}-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Create the draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          body_path: notes/notes.md
          files: dist/*
          fail_on_unmatched_files: true
