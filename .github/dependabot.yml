# Keeps the pinned GitHub Actions (referenced by commit SHA in .github/workflows) up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    ignore:
      # Stay on Ubuntu LTS releases (YY.04 in even years): skip the interim releases up to the next LTS.
      - dependency-name: ubuntu
        versions: ["> 24.04, < 26.04"]
