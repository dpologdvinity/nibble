# git-cliff configuration: renders CHANGELOG.md (Keep a Changelog layout) from the Conventional Commits history.
#
# Release prep (master is protected, so this happens in a pull request before the tag is pushed):
#   git cliff --tag vX.Y.Z -o CHANGELOG.md
# This regenerates the whole file, which turns the "Unreleased" section into the dated vX.Y.Z section. (Do not use
# "git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md": --prepend leaves the old "Unreleased" section in
# place, so the same commits would be listed twice.)
# release.yml fails when CHANGELOG.md has no "## [vX.Y.Z]" section, and uses that section as the release notes.
#
# Commits before the first tag (milestones M0 to M7) are listed under the first release, v0.7.0.

[changelog]
header = """
# Changelog

All notable changes to nibble are listed here, newest first. The file is generated from the Conventional Commits \
history with [git-cliff](https://git-cliff.org) (see `cliff.toml`) and follows the \
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) layout.
"""
# Tera template. Group names carry a leading "<!-- n -->" comment so the sections keep the Keep a Changelog
# order (cliff sorts groups alphabetically); striptags removes the comment again.
body = """
{%- set repo = "https://github.com/dpologdvinity/nibble" -%}
{%- if version -%}
## [{{ version }}]({% if previous.version %}{{ repo }}/compare/{{ previous.version }}...{{ version }}{% else %}{{ repo }}/releases/tag/{{ version }}{% endif %}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]({% if previous.version %}{{ repo }}/compare/{{ previous.version }}...HEAD{% else %}{{ repo }}{% endif %})
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{% endfor %}
{%- endfor %}
"""
trim = false
footer = "<!-- generated by git-cliff from cliff.toml; do not edit by hand -->"

[git]
conventional_commits = true
# Anything that is not a Conventional Commit (the "Merge pull request" commits, for one) is left out.
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
topo_order = false

# The first matching parser wins, so the skip rules come first.
commit_parsers = [
  # The dashboard bot's own data commits are not changes to nibble.
  { message = "^chore\\(dashboard\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^(refactor|build|ci|test|style|chore)", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
]
